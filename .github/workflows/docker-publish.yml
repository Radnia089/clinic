# =============================================================================
# Docker Publish — production image for Tandis Clinic
# =============================================================================
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   REGISTRY_USERNAME
#   REGISTRY_PASSWORD
#
# Image:  registry.hamdocker.ir/amintvk/tandis-clinic
# Tags:   prod  (always on main / version releases)
#         <semver> when pushing v*.*.*
#         sha-<short>  (immutable companion for rollback)
#
# Server: APP_TAG=prod → docker compose pull && docker compose up -d
# =============================================================================

name: Docker Publish

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**/*.md"
      - "android-patient/**"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Primary image tag"
        required: false
        type: string
        default: prod

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILDX_GIT_INFO: "false"
  REGISTRY: registry.hamdocker.ir
  IMAGE: registry.hamdocker.ir/amintvk/tandis-clinic
  NEXT_PUBLIC_APP_URL: https://tandisclinicyazd.ir

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.identity.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require registry credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          ok=1
          [ -n "$REGISTRY_USERNAME" ] || { echo "::error title=Missing secret::REGISTRY_USERNAME"; ok=0; }
          [ -n "$REGISTRY_PASSWORD" ] || { echo "::error title=Missing secret::REGISTRY_PASSWORD"; ok=0; }
          [ "$ok" -eq 1 ]

      - name: Docker metadata (OCI labels + tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=prod,enable=${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag || 'prod' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Tandis Clinic
            org.opencontainers.image.description=Clinic management — Next.js + Prisma + SMS reminders
            org.opencontainers.image.vendor=Tandis Clinic
            org.opencontainers.image.url=https://tandisclinicyazd.ir
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=UNLICENSED

      - name: Resolve build identity
        id: identity
        run: |
          version="${{ steps.meta.outputs.version }}"
          [ -n "$version" ] && [ "$version" != "unknown" ] || version="prod"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            APP_VERSION=${{ steps.identity.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.identity.outputs.build_date }}
          cache-from: type=gha,scope=tandis-clinic
          cache-to: type=gha,mode=max,scope=tandis-clinic
          provenance: mode=max
          sbom: true
          pull: true

      - name: Job summary
        if: always() && steps.build.outcome == 'success'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### Tandis Clinic · image published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`${IMAGE}\` |"
            echo "| **Digest** | \`${DIGEST}\` |"
            echo "| **Commit** | [\`${SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${SHA}) |"
            echo "| **Actor** | \`@${ACTOR}\` |"
            echo "| **Run** | [actions#${{ github.run_number }}](${RUN_URL}) |"
            echo ""
            echo "#### Tags"
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
            echo ""
            echo "#### Deploy"
            echo '```bash'
            echo "# on the server (.env → APP_TAG=prod)"
            echo "docker compose pull && docker compose up -d"
            echo '```'
            echo ""
            echo "Pin by digest (immutable):"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out
        if: always()
        run: docker logout "${REGISTRY}" || true
